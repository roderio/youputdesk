<!doctype html>
<!-- Source of docs/social-preview.png (1280×640, GitHub's social card size). Regenerate with `npm run social`. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bricolage'; src: url('../docs/site/fonts/bricolage.woff2') format('woff2'); font-weight: 200 800; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #170f20; color: #f7f0f8; font-family: 'Bricolage', 'Segoe UI', sans-serif;
    display: grid; grid-template-columns: 1fr 460px; align-items: center; gap: 64px; padding: 0 88px; box-sizing: border-box;
  }
  .name { display: flex; align-items: center; gap: 20px; font-size: 44px; font-weight: 750; letter-spacing: -0.02em; }
  .name img { width: 76px; height: 76px; border-radius: 18px; }
  h1 { font-size: 68px; line-height: 1.02; font-weight: 750; letter-spacing: -0.025em; margin: 36px 0 24px; font-variation-settings: 'wdth' 90; }
  p { font-size: 27px; color: #b9abc6; margin: 0; font-family: 'Segoe UI', sans-serif; line-height: 1.4; }
  .eq { display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px; height: 400px; padding: 28px 24px; background: #231a2f; border-radius: 32px; box-sizing: border-box; align-items: end; }
  .eq i { display: block; border-radius: 10px; background: linear-gradient(180deg, #ff4e45, #7c4dff); background-size: 100% 344px; background-position: bottom; }
</style>
</head>
<body>
  <div>
    <div class="name"><img src="../resources/icon.png" alt=""> YouputDesk</div>
    <h1>YouTube Music for Windows, tuned your way</h1>
    <p>Equalizer, synced lyrics, themes, mini player, global hotkeys. Free and open source.</p>
  </div>
  <div class="eq">
    <i style="height:75%"></i><i style="height:71%"></i><i style="height:67%"></i><i style="height:58%"></i><i style="height:50%"></i>
    <i style="height:46%"></i><i style="height:50%"></i><i style="height:58%"></i><i style="height:67%"></i><i style="height:71%"></i>
  </div>
</body>
</html>
