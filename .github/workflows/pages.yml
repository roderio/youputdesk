# Publishes the website in docs/site (plus the shared screenshots and social image) to GitHub Pages:
# https://roderio.github.io/youputdesk/
name: Website

on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'docs/screenshots/**', 'docs/social-preview.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs. Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/site/. _site/
          cp -r docs/screenshots _site/screenshots
          if [ -f docs/social-preview.png ]; then cp docs/social-preview.png _site/; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
