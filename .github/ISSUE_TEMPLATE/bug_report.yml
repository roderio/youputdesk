name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: YouputDesk version
      description: Settings → Help shows it.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [Windows installer, Windows portable, Scoop, Linux AppImage, Linux .deb]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: OS and version
      description: On Linux, include the desktop (GNOME, KDE…) and whether it's Wayland or X11.
      placeholder: Windows 11 24H2, x64 / Ubuntu 24.04, GNOME on Wayland, arm64
