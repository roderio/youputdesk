<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; style-src 'self' 'unsafe-inline'" />
    <title>YouputDesk mini player</title>
    <link rel="stylesheet" href="./mini.css" />
  </head>
  <body>
    <main class="card" id="card">
      <div class="art-wrap">
        <img id="art" alt="" />
        <button class="open" id="open" title="Open YouputDesk" aria-label="Open YouputDesk">
          <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
        </button>
      </div>
      <section class="info">
        <div class="top">
          <div class="text">
            <div class="title" id="title">Nothing playing</div>
            <div class="artist" id="artist">Start a song in YouputDesk</div>
          </div>
          <button class="icon small" id="close" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <div class="progress" id="progress" role="slider" aria-label="Seek" tabindex="0">
          <div class="fill" id="fill"></div>
        </div>
        <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
        <div class="controls">
          <button class="icon" id="shuffle" title="Shuffle" aria-label="Shuffle">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>
          <button class="icon" id="prev" title="Previous" aria-label="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="icon play" id="play" title="Play" aria-label="Play">
            <svg viewBox="0 0 24 24"><path id="play-path" d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="icon" id="next" title="Next" aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button class="icon" id="repeat" title="Repeat: off" aria-label="Repeat: off">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <span class="badge" id="repeat-one">1</span>
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="./mini.ts"></script>
  </body>
</html>
